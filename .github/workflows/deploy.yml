name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # The default build is root-relative, for the cPanel upload to
        # praxis101.com. Pages is a project site under a path prefix, so this
        # is where that exception is supplied. See astro.config.mjs.
        env:
          SITE_URL: https://band.github.io
          SITE_BASE: /praxis101-com
        with:
          # Track current Node rather than pinning to Astro 7's >= 22.12.0 floor.
          # Matches the version used locally.
          node-version: 26

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
